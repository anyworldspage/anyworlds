<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANYWORLDS – Coming Soon</title>
  <meta name="description" content="Anyworlds is an upcoming video game. Coming soon." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #05070d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .wrap {
      text-align: center;
      max-width: 1100px;
      width: 100%;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .links {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      color: white;
      background: #111827;
      border: 1px solid #263041;
      padding: 12px 18px;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .links a:hover {
      background: #1a2333;
    }

    .brand {
      color: #cbd5e1;
      margin-top: 18px;
      font-size: 14px;
      letter-spacing: 0.18em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="comingsoon.png" alt="Anyworlds coming soon" />
    <div class="brand">ANYWORLDS™</div>

    <div class="links">
      <a href="https://anyworlds.com">Official Site</a>
      <a href="https://discord.gg/AnyWorlds">Discord</a>
      <a href="https://x.com/AnyWorlds">X</a>
      <a href="https://tiktok.com/@AnyWorlds">TikTok</a>
    </div>
  </div>
</body>
</html>
